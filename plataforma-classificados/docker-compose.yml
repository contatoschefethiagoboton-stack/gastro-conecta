# Ambiente local completo: docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: classificados }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-setup:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/classificados-private local/classificados-public &&
      mc anonymous set download local/classificados-public"

  api:
    build: ./apps/api
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/classificados
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: ./apps/api
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/classificados
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    command: node dist/worker.js
    depends_on: [api]

  web:
    build:
      context: ./apps/web
      args: { NEXT_PUBLIC_API_URL: "http://localhost:4000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, miniodata: {} }
